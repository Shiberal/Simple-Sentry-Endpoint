# Standalone Sentry runtime. Prefer root docker-compose.yml so Hub stays on :3000.
services:
  web:
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EDT_HUB_ORIGIN: ${EDT_HUB_ORIGIN:-http://localhost:3000}
      ENABLE_MONITOR_HTTP_PINGER: "false"
      # The dedicated ping-worker service below runs the pings, so the web image must not start its own
      ENABLE_PING_WORKER: "false"
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-https://f6316a1d09d57448f7bc3da188b2868b@error-sink.dev.agoracloud.it/2}
      SENTRY_DSN: ${SENTRY_DSN:-https://f6316a1d09d57448f7bc3da188b2868b@error-sink.dev.agoracloud.it/2}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  ping-worker:
    build: .
    entrypoint: ["node", "scripts/monitor-ping-worker.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONITOR_HTTP_PINGER_INTERVAL_MS: ${MONITOR_HTTP_PINGER_INTERVAL_MS:-60000}
    restart: unless-stopped
    depends_on:
      - web
